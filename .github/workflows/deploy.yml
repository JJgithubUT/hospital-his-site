name: CI/CD React Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 1. Necesario para permitir que GitHub Pages despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Permite que solo se ejecute un despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Ejecutar Linter (oxlint)
        run: npm run lint

      - name: 🛠️ Compilar proyecto (TypeScript + Vite)
        run: npm run build

      # 2. Configurar GitHub Pages antes de subir el artefacto
      - name: ⚙️ Configurar Pages
        uses: actions/configure-pages@v4

      # 3. Subir la carpeta compilada (Vite por defecto usa 'dist')
      - name: 📦 Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # 4. Desplegar el artefacto subido
      - name: 🚀 Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4

  # 5. Trabajo adicional requerido por deploy-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue completado
        run: echo "Sitio desplegado correctamente"