name: CI/CD React Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Necesario para permitir que GitHub Pages despliegue
permissions:
  contents: read
  pages: write
  id-token: write

# Permite que solo se ejecute un despliegue a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Ejecutar Linter (oxlint)
        run: npm run lint

      - name: 🛠️ Compilar proyecto (TypeScript + Vite)
        run: npm run build

      - name: 🔀 Generar fallback 404.html para rutas de React Router
        run: cp dist/index.html dist/404.html

      - name: ⚙️ Configurar Pages
        uses: actions/configure-pages@v4

      - name: 📦 Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4